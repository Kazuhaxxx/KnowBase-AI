services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: helpdesk_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helpdesk_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk_ai}
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./database/migrations/init_pgvector.sql:/docker-entrypoint-initdb.d/01_init_pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-helpdesk} -d ${POSTGRES_DB:-helpdesk_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: helpdesk_ai_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-helpdesk}:${POSTGRES_PASSWORD:-helpdesk_dev_password}@postgres:5432/${POSTGRES_DB:-helpdesk_ai}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      UPLOAD_DIR: /app/backend/storage/uploads
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/backend/storage/uploads
      - hf_model_cache:/root/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    container_name: helpdesk_ai_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

  # Optional local Ollama container profile: docker compose --profile local-llm up
  ollama:
    image: ollama/ollama:latest
    container_name: helpdesk_ai_ollama
    profiles: ["local-llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  pgvector_data:
  backend_uploads:
  hf_model_cache:
  ollama_models:

